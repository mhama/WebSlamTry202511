<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>VISLAM AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: sans-serif; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    #canvas { position: absolute; width: 100%; height: 100%; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.7); color: white;
      padding: 10px; border-radius: 5px; font-size: 12px;
    }
    #start-btn {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px; font-size: 18px;
      background: #007aff; color: white;
      border: none; border-radius: 10px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="info">初期化中...</div>
    <button id="start-btn">ARを開始</button>
  </div>
  <script type="module" src="/src/ar/app.js"></script>
</body>
</html>
